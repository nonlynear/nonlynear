name: Daily Digest

on:
  schedule:
    # Runs every day at 7:00 AM UTC.
    # Adjust the cron expression to match your preferred timezone:
    #   7 AM UTC = 3 AM ET / 12 PM UTC+5 / 4 PM SGT
    - cron: '0 7 * * *'

  # Allows manual runs from the GitHub Actions tab — useful for testing.
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Print HTML to logs instead of sending email (true/false)'
        required: false
        default: 'false'

jobs:
  send-digest:
    runs-on: ubuntu-latest
    # Hard timeout to guard against unexpected infinite loops in the agent.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily digest
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY:       ${{ secrets.BRAVE_API_KEY }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:     ${{ secrets.RECIPIENT_EMAIL }}
          # For manual runs: set debug_mode=true to print HTML without sending.
          DEBUG_MODE:          ${{ github.event.inputs.debug_mode || 'false' }}
        run: python digest.py
