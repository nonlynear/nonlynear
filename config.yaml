  - name: "Tech & Startups"
    description: >
      Notable startup funding rounds, product launches, acquisitions,
      and trends in the broader technology industry.

  - name: "Personal Finance & Markets"
    description: >
      Key market movements, macroeconomic news, personal finance tips,
      and investing insights relevant to individual investors.
